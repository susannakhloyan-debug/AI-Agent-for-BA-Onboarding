<title>Banking User Story Generator</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #d9dfe7;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2e5395;
    --accent-dark: #1f3864;
    --ok: #2f9e44;
    --error: #d14343;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181f;
      --card: #1c222c;
      --border: #333c4a;
      --text: #e5e9f0;
      --muted: #9aa4b2;
      --accent: #6f9ceb;
      --accent-dark: #a9c6f7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .nav { margin-bottom: 12px; font-size: 0.85rem; }
  .nav a { color: var(--accent); text-decoration: none; }
  .nav a:hover { text-decoration: underline; }
  header.masthead {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  h1 { font-size: 1.5rem; margin: 0 0 4px; color: var(--accent-dark); }
  p.subtitle { color: var(--muted); margin: 0; max-width: 56ch; }
  .badge {
    font-family: "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
  }
  form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  fieldset {
    border: none;
    padding: 0;
    margin: 0 0 24px;
  }
  legend {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--accent);
    padding: 0 0 10px;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 4px;
  }
  label .req { color: var(--error); }
  label .hint { color: var(--muted); font-weight: 400; }
  input[type="text"],
  textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 52px; }
  input:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .row { display: flex; gap: 16px; }
  .row .field { flex: 1; }
  .checkboxes { display: flex; flex-wrap: wrap; gap: 16px; }
  .checkbox-field {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.9rem;
  }
  .checkbox-field input { width: auto; }
  .actions { display: flex; align-items: center; gap: 16px; }
  button {
    padding: 12px 22px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: wait; }
  #status { font-size: 0.9rem; min-height: 1.2em; }
  #status.error { color: var(--error); }
  #status.ok { color: var(--ok); }
  .result {
    display: none;
    margin-top: 24px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 12px;
    padding: 22px;
  }
  .result.visible { display: block; }
  .result h2 {
    font-size: 1rem;
    margin: 0 0 10px;
    color: var(--accent-dark);
  }
  .result textarea {
    width: 100%;
    min-height: 320px;
    font-family: "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
    font-size: 0.82rem;
    line-height: 1.5;
  }
  .result-actions { margin-top: 12px; display: flex; gap: 12px; }
  a.dl-link {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
    align-self: center;
  }
  footer.foot {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.78rem;
    text-align: center;
  }
</style>
