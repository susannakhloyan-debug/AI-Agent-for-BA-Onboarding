<title>Banking PRD Generator</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #d9dfe7;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2e5395;
    --accent-dark: #1f3864;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181f;
      --card: #1c222c;
      --border: #333c4a;
      --text: #e5e9f0;
      --muted: #9aa4b2;
      --accent: #6f9ceb;
      --accent-dark: #a9c6f7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; color: var(--accent-dark); }
  p.subtitle { color: var(--muted); margin-top: 0; margin-bottom: 12px; }
  p.babok {
    color: var(--muted);
    font-size: 0.82rem;
    margin-top: 0;
    margin-bottom: 28px;
  }
  form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  fieldset {
    border: none;
    padding: 0;
    margin: 0 0 24px;
  }
  legend {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--accent);
    padding: 0 0 10px;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 4px;
  }
  label .req { color: #d14343; }
  label .hint { color: var(--muted); font-weight: 400; }
  input[type="text"],
  input[type="url"],
  select,
  textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .row { display: flex; gap: 16px; }
  .row .field { flex: 1; }
  button {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: wait; }
  #status { margin-top: 14px; font-size: 0.9rem; text-align: center; min-height: 1.2em; }
  #status.error { color: #d14343; }
  #status.ok { color: #2f9e44; }
  .note {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .note code {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.8rem;
  }
</style>
