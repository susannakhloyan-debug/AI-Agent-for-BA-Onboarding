<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BA Onboarding Plan Generator</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #d9dfe7;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2e5395;
    --accent-dark: #1f3864;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181f;
      --card: #1c222c;
      --border: #333c4a;
      --text: #e5e9f0;
      --muted: #9aa4b2;
      --accent: #6f9ceb;
      --accent-dark: #a9c6f7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; color: var(--accent-dark); }
  p.subtitle { color: var(--muted); margin-top: 0; margin-bottom: 28px; }
  form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  fieldset {
    border: none;
    padding: 0;
    margin: 0 0 24px;
  }
  legend {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--accent);
    padding: 0 0 10px;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 4px;
  }
  label .req { color: #d14343; }
  label .hint { color: var(--muted); font-weight: 400; }
  input[type="text"],
  input[type="url"],
  input[type="number"],
  select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font-size: 0.95rem;
  }
  input:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .row { display: flex; gap: 16px; }
  .row .field { flex: 1; }
  button {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: wait; }
  #status { margin-top: 14px; font-size: 0.9rem; text-align: center; min-height: 1.2em; }
  #status.error { color: #d14343; }
  #status.ok { color: #2f9e44; }
</style>
</head>
<body>
<div class="wrap">
  <h1>BA Onboarding Plan Generator</h1>
  <p class="subtitle">Fill in the fields below and click Generate — a formatted .docx onboarding plan will download automatically.</p>

  <form id="plan-form">
    <fieldset>
      <legend>Required</legend>
      <div class="field">
        <label for="baName">New BA / Intern's Full Name <span class="req">*</span></label>
        <input type="text" id="baName" name="baName" required placeholder="e.g. Shushanik Avetisyan" />
      </div>
      <div class="field">
        <label for="topic">Theme / Feature They'll Work On <span class="req">*</span></label>
        <input type="text" id="topic" name="topic" required placeholder="e.g. Loyalty Points Program Enhancements" />
      </div>
      <div class="field">
        <label for="mentor">Mentor's Full Name <span class="req">*</span></label>
        <input type="text" id="mentor" name="mentor" required placeholder="e.g. Susanna Khloyan" />
      </div>
      <div class="row">
        <div class="field">
          <label for="role">Role</label>
          <select id="role" name="role">
            <option value="new_ba">New Business Analyst</option>
            <option value="intern">Business Analyst Intern</option>
          </select>
        </div>
        <div class="field">
          <label for="durationMonths">Duration (months)</label>
          <input type="number" id="durationMonths" name="durationMonths" value="3" min="1" max="24" />
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Optional</legend>
      <div class="field">
        <label for="productName">Product / System Name</label>
        <input type="text" id="productName" name="productName" placeholder="e.g. MyBusiness" />
      </div>
      <div class="field">
        <label for="subProcessTopic">Process-Modeling Exercise Topic <span class="hint">(defaults to the main theme)</span></label>
        <input type="text" id="subProcessTopic" name="subProcessTopic" placeholder="e.g. Change Passport details of a Client" />
      </div>
      <div class="field">
        <label for="evaluationFrequency">Evaluation Frequency</label>
        <input type="text" id="evaluationFrequency" name="evaluationFrequency" placeholder="Weekly check-ins + Project assessment" />
      </div>
      <div class="field">
        <label for="startDate">Start Date</label>
        <input type="text" id="startDate" name="startDate" placeholder="e.g. 2026-08-04" />
      </div>
      <div class="row">
        <div class="field">
          <label for="prdTemplateName">PRD Template Name</label>
          <input type="text" id="prdTemplateName" name="prdTemplateName" placeholder="Product Requirement Document_template" />
        </div>
        <div class="field">
          <label for="prdTemplateLink">PRD Template Link</label>
          <input type="url" id="prdTemplateLink" name="prdTemplateLink" placeholder="https://..." />
        </div>
      </div>
    </fieldset>

    <button type="submit" id="submit-btn">Generate Onboarding Plan</button>
    <div id="status"></div>
  </form>
</div>

<script>
const form = document.getElementById('plan-form');
const statusEl = document.getElementById('status');
const btn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  statusEl.textContent = '';
  statusEl.className = '';
  btn.disabled = true;
  btn.textContent = 'Generating…';

  const data = Object.fromEntries(new FormData(form).entries());

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: 'Generation failed.' }));
      throw new Error(err.error || 'Generation failed.');
    }

    const blob = await res.blob();
    const disposition = res.headers.get('Content-Disposition') || '';
    const match = disposition.match(/filename="?([^"]+)"?/);
    const filename = match ? match[1] : 'Onboarding_Plan.docx';

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    statusEl.textContent = `Downloaded ${filename}`;
    statusEl.className = 'ok';
  } catch (err) {
    statusEl.textContent = err.message;
    statusEl.className = 'error';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate Onboarding Plan';
  }
});
</script>
</body>
</html>
